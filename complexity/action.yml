name: complexity
description: >-
  Fail when a pull request or push leaves a changed function over Pedro's
  complexity limits (NavHur repositories: cognitive 6, cyclomatic 18; other
  owners: 8 and 16; a stricter repository limit wins), or changes a file it
  cannot measure. Functions the change does not touch never fail it, so
  excesses already on the base don't block a pull request. Runs fleet's
  measure_complexity.py with its pinned analyzers. Check out with
  fetch-depth 0 first.
inputs:
  fleet-ref:
    description: >-
      The NavHur/fleet commit whose measurer and binaries.json pins to use.
      Bump it to pick up measurer fixes.
    default: f947ec1ca696a301293a00a5e4c45e28c070cad1
runs:
  using: composite
  steps:
    - shell: bash
      env:
        # A pull request is checked against its base; a push, against the commit it replaced.
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        FLEET_REF: ${{ inputs.fleet-ref }}
        GH_TOKEN: ${{ github.token }}
        RUN: ${{ github.action_path }}/run.sh
      run: bash "$RUN"
