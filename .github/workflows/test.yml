name: Test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The versions fleet pins in binaries.json (ruff) and the ~/.local/bin/ty the gate uses.
      - run: python3 -m pip install ruff==0.17.3 ty==0.0.94
      - run: ruff format --check .
      - run: make lint
      - run: make typecheck
      # complexity and checks run the actions in a scratch repository, which needs the token.
      - run: make test
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: ./file-size
