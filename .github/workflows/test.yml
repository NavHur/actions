name: Test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s file-size -p "test_*.py"
      - run: python3 -m unittest discover -s ci-cache -p "test_*.py"
      # Runs the action in a scratch repository; this repository's own diff is mostly copies of fleet code.
      - run: python3 -m unittest discover -s complexity -p "test_*.py"
        env:
          GH_TOKEN: ${{ github.token }}
      # Both checks in one run: the second still runs when the first fails, and either failure fails it.
      - run: python3 -m unittest discover -s checks -p "test_*.py"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: ./file-size
