name: file-size
description: >-
  Fail when a pull request or push adds a file over 20,000 bytes (about 5,000
  tokens) or grows one already over. Check out with fetch-depth 0 first.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        # A pull request is checked against its base; a push, against the commit it replaced.
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        RUN: ${{ github.action_path }}/run.sh
      run: bash "$RUN"
